services:
  db:
    image: postgres:16-alpine
    container_name: seeker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seeker
      POSTGRES_PASSWORD: seeker
      POSTGRES_DB: seeker_ai
    ports:
      - "5432:5432"
    volumes:
      - seeker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeker -d seeker_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seeker_pgdata:
